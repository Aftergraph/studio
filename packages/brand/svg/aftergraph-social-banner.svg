    <g transform="translate(215 225) scale(0.5)">
      <path d="M128 24 218 76v104l-90 52-90-52V76z" fill="none" stroke="#42C7E8" stroke-width="10" stroke-linejoin="round"/>
      <g stroke="#F5F7FA" stroke-width="6" fill="none" stroke-linejoin="round">
