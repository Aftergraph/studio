  </g>

  <text x="270" y="145" fill="#F5F7FA" font-family="Inter, system-ui, sans-serif" font-size="80" font-weight="780" letter-spacing="-1.5">Aftergraph</text>
  <text x="274" y="195" fill="#8993A4" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="500">Authority • State • Evidence • Verification</text>

  <!-- Boundary Line -->
  <line x1="72" y1="248" x2="880" y2="248" stroke="#8993A4" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Core Tagline -->
  <text x="72" y="345" fill="#F5F7FA" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="600" letter-spacing="-0.8">Infrastructure for verifiable intelligent systems.</text>

  <!-- Grammar Chain -->
  <text x="72" y="475" fill="#42C7E8" font-family="Inter, system-ui, sans-serif" font-size="16" letter-spacing="4.5" font-weight="700">GRAPHS • BOUNDARIES • AUTHORITY • EXECUTION • EVIDENCE • VERIFIED OUTCOMES</text>

  <!-- Institutional Principles -->
  <text x="72" y="538" fill="#8993A4" font-family="Inter, system-ui, sans-serif" font-size="14" letter-spacing="3.5" font-weight="500">CRYPTOGRAPHIC EVIDENCE • PROVABLE CONTROL • DURABLE AUTONOMY</text>

  <!-- Right Geometric Telemetry / Topology -->
  <g transform="translate(1020 30)" fill="none" stroke="#42C7E8" stroke-opacity="0.75">
