      <circle cx="120" cy="180" r="8" fill="#42C7E8"/>
      <circle cx="250" cy="110" r="8" fill="#7759E8"/>
      <circle cx="400" cy="210" r="9" fill="#24C4AD"/>
      <circle cx="310" cy="360" r="8" fill="#F0A64A"/>
      <circle cx="460" cy="430" r="8" fill="#4C8BD8"/>
      <circle cx="210" cy="470" r="8" fill="#F5F7FA"/>
