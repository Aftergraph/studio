<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Aftergraph App Icon">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1630"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <radialGradient id="kernelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#42C7E8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#42C7E8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer squircle container with safe margin -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#42C7E8" stroke-width="3" stroke-opacity="0.28"/>
  
  <!-- Subtle center glow -->
  <circle cx="256" cy="256" r="160" fill="url(#kernelGlow)"/>

  <!-- Centered Graph Monogram scaled to 512 canvas (scale 1.3, centered) -->
  <g transform="translate(89.6 89.6) scale(1.3)">
    <!-- Outer boundary hexagon -->
    <path d="M128 24 218 76v104l-90 52-90-52V76z" fill="none" stroke="#42C7E8" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- Internal graph lattice -->
    <g stroke="#F5F7FA" stroke-width="6" fill="none" stroke-linejoin="round">
      <path d="M78 92 128 62l50 30v72l-50 30-50-30z"/>
      <path d="M128 62v132"/>
    </g>
    
    <!-- Semantic Node Vertices -->
    <!-- Top: Authority Violet -->
    <circle cx="128" cy="62" r="11" fill="#7759E8"/>
    <!-- Top-Left: System Blue -->
    <circle cx="78" cy="92" r="10" fill="#4C8BD8"/>
    <!-- Top-Right: Control Cyan -->
    <circle cx="178" cy="92" r="10" fill="#42C7E8"/>
    <!-- Bottom-Left: Decision Amber -->
    <circle cx="78" cy="164" r="10" fill="#F0A64A"/>
    <!-- Bottom-Right: Evidence Teal -->
    <circle cx="178" cy="164" r="10" fill="#24C4AD"/>
    <!-- Bottom: Evidence White -->
    <circle cx="128" cy="194" r="11" fill="#F5F7FA"/>
    
    <!-- Central diamond execution kernel -->
    <path d="m128 101 27 27-27 27-27-27z" fill="#42C7E8"/>
  </g>
</svg>
