<!doctype html>
<html lang="da" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f16">
  <title>Offline · Aftergraph Billing</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0f16; color: #f5f7fa; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 2rem; }
    .offline-card { max-width: 420px; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { opacity: 0.8; line-height: 1.5; margin-bottom: 1.5rem; }
    button { background: #59d4ff; color: #0b0f16; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:active { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="offline-card">
    <h1>Du er offline</h1>
    <p>Fakturering kræver forbindelse til serveren. Tjek din netværksforbindelse og prøv igen.</p>
    <button type="button" onclick="location.reload()">Prøv igen</button>
  </div>
</body>
</html>
