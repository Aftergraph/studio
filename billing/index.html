<!doctype html>
<html lang="da" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Billing">
  <meta name="application-name" content="Aftergraph Billing">
  <title>Aftergraph Billing</title>
  <link rel="manifest" href="/billing/manifest.webmanifest">
  <link rel="icon" href="/billing/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/billing/icons/icon-192.svg">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/billing.css">
</head>
<body>
  <header class="billing-header">
    <a class="billing-back" href="/" aria-label="Åbn Aftergraph Studio">
      <span aria-hidden="true">←</span>
      <span>Studio</span>
    </a>
    <div class="billing-brand" aria-label="Aftergraph Billing">
      <span class="billing-mark" aria-hidden="true"></span>
      <span>Aftergraph</span>
      <span class="billing-brand-separator" aria-hidden="true">/</span>
      <strong>Billing</strong>
    </div>
    <button class="billing-quiet-button" id="billing-refresh" type="button">Opdater</button>
  </header>

  <main id="billing-app" class="billing-shell">
    <section class="billing-intro" aria-labelledby="billing-title">
      <div>
        <h1 id="billing-title">Fakturering</h1>
        <p>Det der kræver handling først. Resten kan vente.</p>
      </div>
      <div id="billing-connection" class="billing-connection" aria-live="polite">Indlæser…</div>
    </section>

    <section id="billing-summary" class="billing-summary" aria-label="Faktureringsoversigt" aria-live="polite"></section>

    <nav class="billing-queue-nav" aria-label="Faktureringsnavigation">
      <div class="billing-tabs" role="tablist" aria-label="Faktureringsvisning">
        <button class="billing-tab is-active" type="button" role="tab" aria-selected="true" data-view="inbox">
          Indbakke <span data-count="inbox">0</span>
        </button>
        <button class="billing-tab" type="button" role="tab" aria-selected="false" data-view="ready">
          Klar <span data-count="ready">0</span>
        </button>
        <button class="billing-tab" type="button" role="tab" aria-selected="false" data-view="waiting">
          Venter <span data-count="waiting">0</span>
        </button>
        <button class="billing-tab" type="button" role="tab" aria-selected="false" data-view="needs_info">
          Mangler <span data-count="needs_info">0</span>
        </button>
        <button class="billing-tab" type="button" role="tab" aria-selected="false" data-view="invoiced">
          Faktureret <span data-count="invoiced">0</span>
        </button>
      </div>
    </nav>

    <section class="billing-worklist" aria-labelledby="billing-list-title">
      <div class="billing-list-heading">
        <h2 id="billing-list-title">Indbakke</h2>
        <p id="billing-list-context">Mangler oplysninger først, derefter det der er klar til fakturering.</p>
      </div>
      <div id="billing-list" class="billing-list" aria-live="polite"></div>
    </section>
  </main>

  <div id="billing-toast" class="billing-toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <dialog id="billing-review" class="billing-review" aria-labelledby="billing-review-title">
    <div class="billing-review-frame">
      <header class="billing-review-header">
        <div>
          <p class="billing-review-kicker" id="billing-review-kicker">Fakturakladde</p>
          <h2 id="billing-review-title">Gennemgå faktura</h2>
        </div>
        <button type="button" class="billing-icon-button" data-action="close-review" aria-label="Luk">×</button>
      </header>
      <div id="billing-review-body" class="billing-review-body"></div>
    </div>
  </dialog>

  <script type="module" src="/src/billing/pwa.mjs"></script>
  <script type="module" src="/src/billing/billing-app.mjs"></script>
</body>
</html>
