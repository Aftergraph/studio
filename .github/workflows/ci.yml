name: Aftergraph Studio — Continuous Integration & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Monolithic Release Verification (18 Gates)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python verification dependencies
        run: |
          pip install playwright pillow numpy
          python -m playwright install --with-deps chromium

      - name: Run Node Unit & Invariant Tests
        run: |
          npm test

      - name: Run Workspace Contract & Drift Verification
        run: |
          npm run verify

      - name: Run Platform Source Contracts
        run: |
          npm run verify:platforms

      - name: Run Secrets & Security Scan
        run: |
          npm run verify:secrets

      - name: Run Full Release Verification Suite
        run: |
          node scripts/v6_release_verify.mjs
