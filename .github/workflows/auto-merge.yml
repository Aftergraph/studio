name: Auto-merge Dependabot
on:
  pull_request_target:
    types: [opened, labeled, synchronize]
permissions:
  pull-requests: write
jobs:
  auto-merge:
    # ponytail: only dependabot PRs can auto-merge; other actors skip green
    # instead of failing and blocking the merge queue.
    if: github.actor == 'dependabot[bot]'
    uses: Aftergraph/.github/.github/workflows/auto-merge-dependabot.yml@main
    secrets:
      automerge_pat: ${{ secrets.AUTOMERGE_PAT }}
